<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic / Animated Background Wave Elements (Background Layer) -->
  <g opacity="0.22">
    <path d="M 0,160 Q 300,70 600,160 T 1200,160 L 1200,320 L 0,320 Z" fill="#0284c7">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0,160 Q 300,70 600,160 T 1200,160 L 1200,320 L 0,320 Z;
                M 0,180 Q 300,240 600,130 T 1200,180 L 1200,320 L 0,320 Z;
                M 0,160 Q 300,70 600,160 T 1200,160 L 1200,320 L 0,320 Z"/>
    </path>
    <path d="M 0,200 Q 400,280 800,170 T 1200,220 L 1200,320 L 0,320 Z" fill="#6366f1">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 0,200 Q 400,280 800,170 T 1200,220 L 1200,320 L 0,320 Z;
                M 0,140 Q 400,90 800,220 T 1200,160 L 1200,320 L 0,320 Z;
                M 0,200 Q 400,280 800,170 T 1200,220 L 1200,320 L 0,320 Z"/>
    </path>
  </g>

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="180" y1="0" x2="180" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="1080" y1="0" x2="1080" y2="320"/>
  </g>

  <!-- Dynamic WireGuard Mesh / Overlay Network Graph (Right Side Background) -->
  <g transform="translate(1000, 160)" opacity="0.85">
    <!-- Pulsing Radar Circles -->
    <circle r="75" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="55;95;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="110" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.25">
      <animate attributeName="r" values="90;130;90" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Mesh Connection Lines -->
    <line x1="-50" y1="-40" x2="40" y2="-50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="40" y1="-50" x2="60" y2="30" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="60" y1="30" x2="-20" y2="60" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="-20" y1="60" x2="-60" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="-60" y1="10" x2="-50" y2="-40" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="0" y1="0" x2="-50" y2="-40" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="40" y2="-50" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="60" y2="30" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-20" y2="60" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-60" y2="10" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

    <!-- Mesh Nodes -->
    <circle cx="-50" cy="-40" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="40" cy="-50" r="6" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="60" cy="30" r="5" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="-20" cy="60" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-60" cy="10" r="5" fill="#818cf8" filter="url(#glow)"/>

    <!-- Central Zero-Trust Coordinator Node -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="url(#titleGrad)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="fill" values="#38bdf8;#c084fc;#38bdf8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content: Pill, Title, Subtitle, Tags (Completely Visible & Unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="285" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="142" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">🔐 SECURE OVERLAY &amp; MESH NETWORKING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome VPN &amp; Zero Trust Networking</text>

    <!-- Subtitle -->
    <text x="0" y="174" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">Curated WireGuard Meshes, Zero Trust Network Access (ZTNA) &amp; Overlay Networks</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
      <text x="90" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ WireGuard Mesh</text>

      <!-- Tag 2 -->
      <rect x="195" y="0" width="220" height="32" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
      <text x="305" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Zero Trust Access (ZTNA)</text>

      <!-- Tag 3 -->
      <rect x="430" y="0" width="185" height="32" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
      <text x="522" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Overlay Networks</text>
    </g>
  </g>
</svg>
